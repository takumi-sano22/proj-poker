  choice: "PLAYER_DECLARED / PHYSICAL_CHIP_ACTION / DEALER_RULING を Event Log に残し版 5 に上げる（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "宣言・物理的なChip操作・Dealerの裁定をPLAYER_DECLARED / PHYSICAL_CHIP_ACTION / DEALER_RULINGとしてEvent Logに残し、Eventのschema_versionを5に上げる。版1〜4は読み込めるままにし、保存済みの行は書き換えない（D76）。実装は#64。"
- id: D91
  choice: "Ruling は TDA 準拠の 3 種（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Rulingは、Oversized Chip（宣言なしで大きいChipを1枚出したらCall、相手のBetが無ければその額のBet）・String Bet（宣言なしで複数回に分けて出したら最初の1回の量で確定）・Out-of-Turn（手番を戻して警告し、その間に状況が変わらなければOOTのActionを拘束、変われば撤回できる）のTDA準拠の3種を、版付きRule Profileの暫定値とする（OI-008の暫定値。永久仕様にしない）。物理的な誤操作をするのはHeroだけとする。実装は#63。"
- id: D92
  choice: "Chip の額面は 1/5/25/100/500 の 5 種（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Chipの額面は1（白）・5（赤）・25（緑）・100（黒）・500（紫）の5種をPresetの暫定値とし、額からChipの構成を自動で組む（OI-004の暫定値。永久仕様にしない）。実装は#62。"
- id: D93
  choice: "Replay は Hero 視点の一手ずつ・Fast Forward は待ちの短縮（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "ReplayはHand一覧から選び、保存済みEventをHeroの視点でPrevious / Next / Play / Pauseで再生する（Showdownで公開された札は公開時点から見える）。Learning-only Full RevealとJump to Important SpotはPhase 5のReviewで扱う。Fast ForwardはHero Fold後に演出とCPUの待ちを縮め、Claudeの応答時間そのものは縮めない。実装は#67・#68。"
- id: D94
  choice: "Phase 5 を 9 つの子 Issue に分解（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Phase 5（MVP Review）を#77〜#85の9つの子Issueに分解する（1 Sessionの永続化とResume / 2 Hand Summary Projectionと判断時点のHero Information Set・Important Spot / 3 Equity・RangeとAlternative Action / 4 Local KB / 5 Solver Adapter / 6 Review AI（Pass A）・Evidence Sufficiency Gate・Versioned Review / 7 Reveal Review（Pass B）とFollow-up / 8 ReviewのUI / 9 6-maxのE2EとREADME）。Solver選定のPoCは#76で行った。Web Fallback（OI-010）はMVPに入れず、根拠が足りないときはInsufficient Evidenceと表示する。"
- id: D95
  choice: "Event を版 6 に上げ、Session Projection と reviews のテーブルを足す（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "SESSION_STARTED / SESSION_ENDED / Handの打ち切り / Emergency Botへの切り替えをEventとして追加し、Eventのschema_versionを6に上げる（D88のEvent化）。DBにSession Projectionと、Version付きで上書きしないreviews（D39）のテーブルを自前のマイグレーションで足す。版1〜5と既存の行は書き換えない（D76）。実装は#77・#82。"
- id: D96
  choice: "Primary Solver は amaster97/poker_solver の HU River / Turn（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "#76のPoCに基づき、Primary Solverをamaster97/poker_solver（MIT）とし、CapabilityはHUのRiverとTurnだけを宣言する。FlopとMultiwayはUnsupportedとして正常にFallbackし前提を表示する（OI-009）。noambrown/poker_solverはテストでの照合にだけ使い、TexasSolverは採用しない。OI-002をこの判断で選定とする。実装は#81。"
- id: D97
  choice: "Review は Sonnet 5.5、重要 Spot だけ Opus 5.5（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "review_standardの暫定値をclaude-sonnet-5-5、review_deepをclaude-opus-5-5とし、role-based configに置く（OI-001の暫定値。永久仕様にしない）。review_deepはHeroが「詳しく」を選んだSpotだけに使う。呼び出しはD87どおりClaude CodeのOAuth（サブスク枠）を使う。実装は#82。"
- id: D98
  choice: "KB は apps/server/kb/ の Curated KB、E2E は Playwright と Fake（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Local KBはdocs/researchから要点を抜き出したCurated KB（MetadataつきMarkdown・Version付き）としてapps/server/kb/に置き、Metadataと全文で検索する（Vector DBは使わない）。6-max SessionのE2EはPlaywrightで通し、CPUはRuleBot、Review AIは録画済みの応答を使ってCIで回す。実際のClaudeでの通しは手動で1回行う。実装は#80・#85。"
- id: D99
  choice: "Pass B と Follow-up は新しい追記だけのテーブルに保存する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Reveal Review（Pass B）と Follow-up の履歴は、マイグレーションv4で足す追記だけのreveal_reviews（Version付き・Assessmentを持たない）とreview_followups（ReviewのVersionに紐づけてターンごとに追記）に保存する。Pass Aのreviewsは変えず、Pass Bに評価を付けない（結果論を混ぜない）。既存のテーブルと行は書き換えない（D76）。実装は#83。"
- id: D100
  choice: "Hand ごとの Best-effort Metadata を Event に残してから #2 をクローズする（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "親#2のDoD「Best-effort Model / Config / Debug Metadata」を満たすため、HandごとのApp Version・Rule Profile Version・席ごとのCPUのprovider / Model Role / Concrete Model・Persona Profile VersionをHAND_METADATA_RECORDED（Visibilityはsystem）としてEvent Logに残し、Eventのschema_versionを7に上げる。版1〜6と既存のテーブル・列は変えない（D76）。AIのRequest / Responseの生データは容量と機密の観点から保存しない。親#2は#97のマージ後にクローズする。"
- id: D101
  choice: "Review の文の内部識別子は、Retry せず保存前の後処理で置換する（AskUserQuestion）"
  status: "採用済み"
  decision: "Review AI（Pass A・Pass B・Follow-up）の出力にplayerIdやEvidenceの項目名などの内部識別子が残ったとき、Retryはせず（追加の呼び出しを増やさない）、検証を通った出力を保存前に既知の対応表で機械的に置換する（playerId→Heroの画面に出ている表示名、項目名→自然な言葉）。未知の識別子は推測で置換しない。あわせてPromptで識別子を書かないよう指示し、Evidenceに表示名と項目の説明を添える。情報境界は変えない（Persona・Hidden Cardsは渡さない）。Review Evalに識別子の残存率を指標として足す（#96）。"
- id: D102
  choice: "Post-MVP は #104 → #105 / #106 / #107 の Parent 構造で、Phase 6 → 7 → 8 の順に Gate を守る（#104 の人間確定事項）"
  status: "採用済み"
  decision: "MVP後はPost-MVP Parent #104の下にPhase 6（#105）・Phase 7（#106）・Phase 8（#107）のParentを置き、その下に子Issueを作る（#2は再オープンしない）。実装は#105→#106→#107の順で、前Phaseの#104のPhase Gateを満たすまで次Phaseの機能実装に入らない（調査・設計メモは可）。MVPの不変条件（決定論のEngine・Event Log正本・CPUごとのKnowledgeState / Private Memoryの分離・Hidden / Future Cards・Learning-only Revealを漏らさない）はそのまま継承し、Stats / Profile / Memory Summary等は再生成できるProjectionとする。Full Multiway Solver・Push/Fold Nash Solver・MTT・Re-entry / Rebuy / Add-on・LLM Memoryを正本とする構成等でPost-MVPをBlockしない。"
- id: D103
  choice: "Phase 6 の Stats は全 Player 対応の Projection、Score は Versioned 暫定式 ScoringPolicy phase6_provisional_v1（#104・#105 の人間確定事項）"
  status: "採用済み"
  decision: "StatsはEvent Logから再計算する全Player対応の汎用Projectionとし、Numerator / Denominator / Opportunity Countを持つ。Phase 6のUIはHeroを主対象にし、Play中のHUDは足さない（D32）。ScoreはVersion付きの暫定式ScoringPolicy（最初はphase6_provisional_v1）で計算し、Pass AのAssessmentをstrong 100・reasonable 80・mixed_marginal 60・improvement_suggested 35・major_leak 0とし、insufficient_evidenceは集計から除く。1 Decisionは複数のAbilityに寄与でき、割り当てとWeightは決定論・Version付き。Confidenceは点数を変えず集計のWeightに使い、ScoreはConfidence / Sample Size / Evidence IDs / Trendと一緒に扱う。数値はOI-006の暫定値でPlaytest後に変えられ、永久仕様にしない。D05・D34の具体化。"
- id: D104
  choice: "Player Profile は Recent（直近 100 有効 Decision・暫定 Config）と Long-term に分け、Hypothesis は決定論で状態遷移する（#104・#105 の人間確定事項）"
  status: "採用済み"
  decision: "Player ProfileはRecent（直近100の有効Decision。OI-006の暫定値でConfigに置く）とLong-term（全有効Evidence）を分ける。Weakness HypothesisはSupporting / Counter Evidenceを構造化して保存し、状態遷移（Suspected / Supported / Strong / Improving / Resolved / Insufficient Data）は決定論で行う（LLMを正本にしない）。自然言語のPlayer Profileは構造化Evidenceからの派生物で正本にせず、過去の自然言語Summaryを次の正本にしない。D18の具体化。"
- id: D105
  choice: "User Read / Note / Tag は Phase 6 で先に実装し、Drill は過去 Hand 由来の決定論変形を基本に Engine Validation 必須・通常 Score と別系列（#104・#105 の人間確定事項）"
  status: "採用済み"
  decision: "User Read / Note / TagはPhase 6で実装し、対象はseat id（cpu1等）を永続Identityとみなさない参照にしてPhase 7のcpuProfileIdと接続できるようにする。Hidden PersonaやLearning-only RevealをHero向けのObservation Evidenceに使わず、Play中に読みの当たり外れを見せない。Drillは過去Handからの決定論的な変形（一要素だけ変える）を基本とし、元Hand / Decision / Evidenceのprovenanceを持つ。LLMでSpotを生成する場合もPoker EngineのValidationを必ず通す。Drillの結果は通常PlayのAbility / Overall Scoreへ直接混ぜない。D31・D33・D35・D36の具体化。"
- id: D106
  choice: "Fixed CPU は永続 cpuProfileId を持ち、Memory は append-only の Raw Evidence と再生成できる Projection に分ける（#104・#106 の人間確定事項）"
  status: "採用済み"
  decision: "Fixed CPUは席・player id（cpu1等）と別の永続cpuProfileIdを持ち、MemoryはSessionを跨いで持続する。GuestのMemoryはSession終了時に破棄する。CPUのObservationは観察できたPublic / Showdown Evidenceだけをprovenance（Observer / Subject / Source Hand or Event / Visibility / Timestamp or Hand Number）付きでappend-onlyに記録し、Hypothesis / TendencyはRaw Evidenceから再生成できるProjectionとして、集計にrecency decayをかける（Raw Evidenceは消さない）。CPU-to-CPU MemoryはObserver CPUがSubjectについて持つPrivate Memoryで、他CPUへ共有せずLearning-only Revealを入れない。Raw ObservationはCash / Tournamentで共通に使えるが、Strategy Hypothesisはcontextを分ける。Table TendencyはPublic / 観察可能なEvidenceだけから作り、個々のPrivate Memoryを集約しない。decayの係数等はVersion付きの暫定値とする。D11・D29・D30・D63の具体化。"
- id: D107
  choice: "Tilt は Versioned deterministic State Machine で、Session 終了で Reset する transient state（#104・#106 の人間確定事項）"
  status: "採用済み"
  decision: "TiltはVersion付きの決定論State Machineとし、Hand間で増減・減衰してSession終了でResetする。Persona / Long-term Memoryとは別のtransient stateとして持ち、Personaの確率分布へ限定的に反映する（Illegal / RandomなActionを混ぜない）。TiltのPrivate StateをHeroのEvidenceに使わない。Triggerやしきい値・減衰はVersion付きの暫定値とする。D27の具体化。"
- id: D108
  choice: "Tournament は既存 Hand Engine の上に TournamentSession 層を置き、最初の標準 Preset は 6-max STT（#104・#107 の人間確定事項）"
  status: "採用済み"
  decision: "Tournamentは既存の決定論Hand Engineを複製せず再利用し、その上にTournamentSession層を置く（初期ScopeはSingle Table・2〜8人）。最初の標準Presetは6-max STTとする。Blind StructureはCoreで時間base / Hand数baseの両方を扱い、標準PresetはHand数base。Anteはnone / per_player / big_blind_anteをProfileで扱い、標準STTはBig Blind Ante。初期6-max STTのPayoutの暫定Presetは50% / 30% / 20%で、Custom Payoutを後から足せる構造にする（OI-007の暫定値。永久仕様にしない）。Re-entry / Rebuy / Add-onは初期Scope外で、Bust = Elimination。D52〜D54の具体化。"
- id: D109
  choice: "CPU の KnowledgeState に Public Tournament Context を足し、2〜8 人の決定論 ICM を Chip EV と別 Evidence にする（#104・#107 の人間確定事項）"
  status: "採用済み"
  decision: "CPUのKnowledgeStateにPublic Tournament Context（残人数・Blind Level・StackのBB換算・Payout・ICM pressure等）を足す（Hidden Stack・Private Memoryの境界は変えない）。ICMは8人以下（2〜8人）向けの決定論のICM Calculatorで計算し、LLMをICMの数値の正本にしない。ICMはChip EVと別のEvidenceとしてReviewに渡し、混同しない。Push/Fold Nash Solver等のTournament SolverはPhase 8の初期Scope外。D53の具体化。"
- id: D110
  choice: "Phase 6 を #105 の推奨どおり 8 つの子 Issue に分解（推奨案、AskUserQuestion）"
  status: "採用済み（実装順のP6-3とP6-4はD113で入れ替え）"
  decision: "Phase 6（Session Learning）を#112〜#119の8つの子Issueに分解し、この順に進める（1 Analytics Projection / Detailed Stats / 2 Ability EvidenceとScoringPolicy / 3 Hypothesisの状態遷移とRecent・Long-term Profile / 4 User Read・Note・Tag / 5 Session Review・Learning UI / 6 Targeted Drill / 7 Learning系のResetとProjectionの作り直し / 8 Eval・Critical E2E・README）。P6-0は#108で済んだ。Phase 6のDrillは決定論の変形だけを実装し、LLMでSpotを生成する経路はPhase 6の範囲外とする（必要になったら別Issue。その場合もEngine Validation必須。D105）。"
- id: D111
  choice: "Phase 6 の Projection は都度計算・保存しない（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Phase 6のStats / Score / Profileは、Event Logとreviewsから都度計算し、保存しない（これらのProjectionのためのマイグレーションを足さない）。表示が遅くなった時点でCacheのテーブルを別Issueで足す。Weakness HypothesisはこのD111の対象外で、D104どおりSupporting / Counter Evidenceを構造化して保存する（保存の形は#114で決める）。D37・D103の具体化。"
- id: D112
  choice: "User Read は Event・Note / Tag は追記型テーブル（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "User Readは判断時点の情報なのでUSER_READ_RECORDEDとしてEvent Logに残し、Eventのschema_versionを8に上げる（版1〜7は読めるまま、保存済みの行は書き換えない。D76）。Note / TagはHandに属さないので、マイグレーションv5で足す追記型のテーブルに置く（既存のテーブル・列は変えない）。対象はseat idを永続Identityとみなさない参照で持つ（D105）。実装は#115。"
- id: D113
  choice: "Weakness Hypothesis は作り直せる Snapshot 表に保存し、#115 を #114 より先に実装する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Weakness Hypothesisの構造化保存（D104・D111）は、hypothesis_id・type・status・Supporting / Counter EvidenceのID・計算したPolicyのVersion・計算時刻を持つSnapshotのテーブルとし、reviewsから決定論で作り直せる派生データとして扱う（消して作り直してよい。正本にしない）。Hypothesisのtypeの一覧と状態遷移のしきい値はVersion付きの暫定Policy（OI-006の暫定値）に置く。D112のマイグレーションv5（Note / Tag）を守るため、#115（P6-4）を#114（P6-3）より先に実装し、Hypothesisのテーブルはマイグレーションv6で足す（D110の実装順のうちこの2つだけを入れ替える）。D104・D111の具体化。"
- id: D114
  choice: "Learning Reset は区切りの行を追記し、正本を消さない（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Learning Resetは追記型のテーブル（Resetの時刻・対象カテゴリ）に区切りの行を足し、Score / Profile / Hypothesisはそれぞれ、そのカテゴリを対象に含む最後のLearning Resetより後のEvidenceだけで計算する。Event Log・reviews等の正本は消さず、削除拒否のTriggerも外さない。User Read / Note / TagはLearning ResetでもOpponent Memory Resetでも消さない（消えるのはHand History Delete / Factory Resetだけで、この2つはPhase 6の範囲外のまま）。D64・D37の具体化。実装は#118。"
- id: D115
  choice: "Score と Decision Quality Summary は Review 済みの判断だけを数える（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Ability / Overall ScoreとSession ReviewのDecision Quality Summaryは、Pass AのReviewがある判断だけで計算し、対象の判断の数とReview済みの数（M件中N件）を必ず表示する。Reviewを自動・一括で生成する経路は足さない（API課金を増やさない）。同じ判断に複数のVersionがあれば最新を使う。D103・D111の具体化。"
- id: D116
  choice: "Drill は専用 Session の通常 Hand として保存し、追記型の drills 表で区別する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Drillは専用のSessionの通常のHandとしてPoker Engineで終局まで進め（相手のActionは元HandのScriptかRuleBotの決定論）、Event Logに保存する（Eventの形は変えない）。元のHand / Decision / Reviewのid・変形の種類・seed・DrillのHandのidを持つ追記型のdrillsテーブルで通常Playと区別し、Stats・Score・Profile・Hypothesis・Resume・Replayの通常の集計はdrillsにあるHandを除く。DrillのReviewは既存のPass Aの経路をそのまま使う。D105・D110の具体化。実装は#117。"
- id: D117
  choice: "意味上の順序は永続的な単調増加の論理順序で決め、壁時計は表示・監査の Metadata にする。#129・#130 を直すまで Phase 6 → 7 Gate を保留する（#132 の人間判断）"
  status: "採用済み"
  decision: "正しさに関わる「どちらが先か」の順序・境界（Learning Resetの前後・Replayの新しい順・Session内のHandの順・Recentの順・最新のSession Projectionの選択・Resume等）には壁時計を使わず、永続的な単調増加の論理順序を正本にする。created_at / started_at / recorded_at等の壁時計の列は表示・監査のMetadataとして残してよいが、順序の正本にしない。時刻をclampして戻らない時計に見せる解決は採らない。論理順序は追加マイグレーションで表し、既存のテーブル・列・行とappend-only / DELETE拒否の契約を壊さない。#129・#130は同根の横断問題として#132でまとめて直し、それまでPhase 6 → 7 Gateを保留する。D37・D76・D114の具体化。"
- id: D118
  choice: "Fixed CPU の Identity は追記型の session_participants（マイグレーション v10）で席と結び、Observation は表に持たず Event Log から決定論で抽出する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "マイグレーションv10で追記型のsession_participants（Session×席 → Fixed CPUのcpuProfileId、またはGuestのSession限りのid）を足し、席・player id（cpu1等）と永続Identityを分ける。Fixed Pool（cpuProfileId・名前・Persona）はDBに置かず、Persona Presetと同じくコードのVersion付きConfigに置く（OI-005の暫定値: Fixed 8人＋Guestは1卓に最大1席）。CPUのObservationは別の表やEventに書かず、正本のEvent LogからそのObserverが見えたPublic / Showdown Evidenceだけを決定論で抽出し、provenanceはhand_id・events.seq・ordinals.ordで持つ。GuestのIdentityはSession限りなので、次のSessionでは読まない（＝破棄。行は消さない）。Note / TagのSubjectにcpu_profileのkindを足し、既存のsession_playerの行はsession_participantsから引く（保存済みの行は書き換えない）。D105・D106・D111・D76の具体化。実装は#136・#137。"
- id: D119
  choice: "OI-011 の暫定値は指数減衰と 0〜3 の整数 Tilt で置く（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "OI-011の暫定値をVersion付きのPolicy（phase7_memory_v1・phase7_tilt_v1）に置き、永久仕様にしない。HypothesisのrecencyはObserverがそのSubjectを見たHandの数に応じた指数減衰（半減期150 Hand）、十分なSampleは機会数15以上（PersonaのSkillで0.5〜1.5倍。弱いCPUは少ないSampleで早合点する）。Tiltは0〜3の整数の段階で、Trigger（40BB以上のPotの負け・3連敗・ShowdownでBluffが見つかる・大勝ち）で上がり、1 HandごとにPersonaのrecoverySpeedに応じて下がり、Persona のLooseness / Aggressionを段階ごとに上限付きで少しずらすだけにする。decay・Sample・Tiltの順序はすべて論理順序（ordinals.ord・Handの番号・events.seq）で決め、壁時計を使わない。D106・D107・D117の具体化。実装は#138・#140。"
- id: D120
  choice: "Opponent Memory Reset は追記型の区切りの表（マイグレーション v11）で表し、正本を消さない（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Opponent Memory ResetはD114と同じく正本を消さず、マイグレーションv11で足す追記型の区切りの表に行を足す。区切りは追加した時点のordinalsの最大のordを列に持って判定し、ordinalsのkindのCHECKは変えない。対象は全CPUか1つのcpuProfileId（Fixed CPU Factory Reset）。Event Log・reviews・User Read / Note / Tag・Learning Resetの区切りは変えない。D64・D114・D117の具体化。実装は#143。"
- id: D121
  choice: "Phase 7 は P7-0〜P7-9 を直列で進め、CPU の Memory は上限付きで KnowledgeState へ注入する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "Phase 7の子Issueは#106の推奨どおりP7-0〜P7-9（#135〜#144）とし、依存順に直列で進める。CPUのMemoryは、KnowledgeStateに構造化したHypothesisの要約（Evidence ID付き、Subjectごとに上位5項目まで）として足し、Claudeの CPUはPromptでこれを受け取る。LLMの呼び出しの回数・経路は増やさない（PromptのTokenは少し増える）。RuleBotは同じ要約を決定論で使う。自然言語のMemoryを正本にしない。D40・D106・D110の具体化。"
- id: D122
  choice: "Hero の Review の Evidence に、判断時点より前に Hero が観察できた public の Table Tendency を構造化 Evidence として入れる（#153 の人間判断）"
  status: "採用済み"
  decision: "Hero の Decision ReviewのEvidenceに、判断時点より前の保存済みのHandのpublicのEventだけから決定論のコードで作ったTable Tendencyを、構造化Evidence（Evidence ID付き）として足す。判断時点より後の情報・Learning-only Reveal・CPUのPrivate Memory / Private Hypothesis・CPUのPersona・Tiltは使わない。Table Tendencyの数値は決定論のコードが正本で、Review AIは説明だけを行う。Review Evidence / Promptの契約の変更とdocs・Evalの更新は#153で行う。D35・D106・D117の具体化。"
- id: D123
  choice: "Memory 付き Prompt の Claude CPU の実モデル Eval を、API キーを使わず既存の OAuth 経路で、最大 36 Decision に限って録画する（#155 の人間判断）"
  status: "採用済み"
  decision: "Memory・Table Tendency・Tiltが入ったPromptのClaude CPUの品質を、eval:opponentと同じClaude Agent SDK・Claude CodeのOAuth（サブスク枠）・buildClaudeEnvの経路で録画する。API キーは使わず、API課金に切り替わる環境変数は除く（D87）。初回の上限は代表Spot 2・Persona 6・条件最大3（baseline・Loose側・Tight側）・repeat 1の最大36 Decision（Retryを含む呼び出しは最大72回相当）。確認するのは、Memory / Table Tendency / Tiltの戦略への反映の向き・Structured Output / Legal Action / Retry / Fallback・Persona Differentiation・Hidden Information Leakage 0（他CPUのPrivate Memory / Personaを含む）・Latency。CIは実モデルを呼ばず録画の再生だけで、paramsHashでPrompt / Optionsのdriftを検出する。OAuthのログイン・利用枠で実行できなければAPI キーへ切り替えず停止する。D40・D87・D121の具体化。実装は#155。"
- id: D124
  choice: "CPU Memory の永続 Cache は、Hand ごとの観察を派生の表（マイグレーション v12）に持ち、読むときに足りない分だけ補う（#150 の測定を受けた人間判断、AskUserQuestion）"
  status: "採用済み"
  decision: "#150の測定（実SQLiteで5,000 HandのHandの開始が約0.98秒。約85%がMemory）を受け、CPU Memoryに永続のCacheを足す。Cacheするのは、Handごとに抽出したObservation（Observer別・抽出のVersion付き）で、マイグレーションv12の派生の表に置く。HypothesisのrecencyとSampleの集計は今どおり都度計算し、Cacheに入れない。更新はHandの開始でMemoryを読むときに、Cacheに無いHand（論理順序のordで判定）だけを作って足し、Handの保存のトランザクションは変えない。表は消してもEvent Logから作り直せる派生で正本にしない。DELETEを許し（v6のhypothesis_snapshotsと同じ扱い）、抽出のVersionが変わったら消して作り直す。Opponent Memory Reset（D120）・Guest（D118）・論理順序（D117）の判定は今どおりEvent Log側の情報で行う。D118の「Observationは別の表やEventに書かない」は正本の置き場の規定で、この表は正本ではなく作り直せる派生のCacheなので、D118を変えない。D76・D106・D111・D118の具体化。実装は#165。"
- id: D125
  choice: "Review の自然言語中の数値 Grounding は Phase 7 では実装せず、横断の品質課題として残す（#168 の人間判断）"
  status: "採用済み"
  decision: "Review の文の中の数値（Pot・Stack・Equity・%等）をEvidenceと機械照合するruntimeの汎用的な検証は、Phase 7では実装せず、Phase 7のBlockerにしない。Promptで「Evidenceの数値をそのまま使い、再計算・創作しない」と指示し、GroundingがEvidence IDの実在と利用条件まで検査していること、表現差・丸め・BB併記でfalse positiveが増えること、#169でHeroが正本のTable Tendencyの値をUIから直接確かめられるようにすることを理由とする。LLMのRetryを増やす変更はしない。#168は横断の品質課題として#104の配下に残す。D40・D122の具体化。"
- id: D126
  choice: "River の代表 Spot だけで Claude CPU の実モデル Eval を追加測定する（最大 36 Decision・72 呼び出し。#171 の人間判断）"
  status: "採用済み"
  decision: "#155の初回（D123）でRiverのCallの割合がloose < tightになったのが少数標本の揺れかを確かめるため、river_facing_big_betの1 Spot × Persona 6 × 条件3（baseline・loose・tight）× 追加repeat 2の最大36 Decision（Retryを含む呼び出しは最大72回）を追加で録画する。経路はD123と同じ（Claude Agent SDK・Claude CodeのOAuth〔サブスク枠〕・buildClaudeEnv。API キー不使用。Bedrock / Vertex / Foundry等へ切り替えない）。D123の録画は残し、追加分は別の録画（または別のVersion）として管理し、CIは再生だけ。既存の録画と追加分を合わせてRiverを集計する。結果が意図した向きにならなくても、その場でPrompt / Policyを変えず、十分なサンプルでも逆向きが続くなら事実を記録して新しいIssueに分け、人間判断に返す。OAuth・利用枠で実行できなければAPI キーへ切り替えず停止する。D87・D123の具体化。"
- id: D127
  choice: "標準 6-max STT は Starting Stack 1,500・10 Hand ごとに上がる Blind 表・参加費 100pt（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "標準の6-max STT（hand-count）の暫定値を、Starting Stack 1,500、Blind（SB / BB）を10/20 → 15/30 → 25/50 → 50/100 → 75/150 → 100/200 → 150/300 → 200/400 → 300/600 → 400/800 → 600/1,200 → 1,000/2,000（最後のLevelは続ける）とし、10 Handごとに1 Level上げる。Big Blind Anteの額はBBと同じ。Prize Poolは参加費100pt × 参加人数（6人で600pt。50 / 30 / 20で300 / 180 / 120）。いずれもOI-007の暫定値でVersion付きのConfigに置き、Playtest後に変えられる（永久仕様にしない）。D108の具体化。実装は#183・#184・#186。"
- id: D128
  choice: "Ante は TDA 準拠の Dead Money、time-base は Core と UI の両方で選べるようにする（AskUserQuestion）"
  status: "採用済み"
  decision: "AnteはDead Moneyとし、Call / Raiseの額とUncalledの返却に数えない。Big Blind AnteはBBの席がBlindを先に払い、残りでAnteを払う（Stackが足りなければAnteが減る。TDA準拠）。Big Blind AnteはMain Potに入れる。per_playerのAnteは各自の拠出としてPotの段に入れる。time-baseのBlind StructureはCoreとテストに加えてUIでも選べるPresetにする（暫定値は標準と同じStackとBlind表で1 Level 10分。OI-007）。経過時間はプレイ時間（Handの開始から終わりまでの累計。アプリを閉じていた時間は数えない）で測り、LevelはHandの開始時に決めてHAND_STARTEDに固定する。壁時計は経過時間の計測にだけ使い、意味上の順序には使わない（D117）。D108の具体化。実装は#184・#190。"
- id: D129
  choice: "Hero の Bust で Tournament を終え、Tournament は Event Log だけに残して Projection は都度計算する（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "HeroがBustした時点でそのTournamentを終え、Heroの順位とPayoutを確定する。残ったCPUの順位は未決として表示し、CPUだけで続けない（Claudeの呼び出しを増やさない）。Heroが最後の1人になれば優勝。Sessionの終了理由は既存のhero_busted / hero_last_standingを使い、session_projectionsのCHECKを変えない。Tournamentの設定のSnapshot・Level・Ante・Elimination・終了はEvent Logに残し（Eventの形を変えるときはschema_versionを上げ、旧版の行をupcastで読む。保存済みの行は書き換えない）、順位・Payout・ResultなどのTournamentのProjectionはEvent Logから都度計算する（テーブルを足さない。遅くなった時点でCacheを別Issueで足す）。旧版のSessionはCashとして読む。D37・D76・D95・D111の具体化。実装は#183〜#186。"
- id: D130
  choice: "ICM は全席の Equity・Bubble Factor・All-in の必要 Equity まで構造化して CPU と Review に渡す（推奨案、AskUserQuestion）"
  status: "採用済み"
  decision: "CPUのPublic Tournament Contextには、全席のStackとBB換算・ICM Equity（ptと%）・Stage（bubble / in the money / heads-up）・自分から見た相手ごとのBubble Factorを構造化して足す（すべて公開のStackから決定論で計算する）。Reviewでは判断時点のICM Equityを常にEvidenceとして出し、All-inが関わる判断（Shove・All-inへのCall）ではChip EVの必要Equity（Pot Odds）とICMの必要Equityを別の項目として並べる。All-inへのCallは相手の額が決まっているのでそのまま計算する。Shoveは「特定の1人にCallされ、ほかはFoldした場合」の条件付きの必要EquityをCallしうる相手ごとに出し、Fold Equity・Callの頻度は含めない（その前提をEvidenceと画面に明記し、Review AIへ前提ごと渡す。Push/Fold Solverを暗黙に入れない。#192のCodexの指摘を受けた人間判断）。ICMの数値は決定論のICM Calculatorが正本で、Review AIとCPUは計算しない。D109の具体化。実装は#187〜#189。"
